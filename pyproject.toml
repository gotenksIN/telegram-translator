[project]
name = "telegram-translate-bot"
version = "0.1.0"
description = "Telegram bot that translates messages and Twitter/X previews using Gemini"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Omkar Chandorkar", email = "gotenksIN@aospa.co" }
]

dependencies = [
    "beautifulsoup4>=4.14.0",
    "google-genai>=1.55.0",
    "httpx>=0.28.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.0",
    "python-telegram-bot>=22.0",
    "yt-dlp>=2026.3.17",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 120
exclude = ["__init__.py", ".venv"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
